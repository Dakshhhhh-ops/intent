name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: |
          node dist-cli/intent-replay.mjs report examples/cart-rounding.claude.jsonl > report.md
          grep -q "Contradicted" report.md
          ! node dist-cli/intent-replay.mjs check examples/cart-rounding.claude.jsonl --fail-on high
          node dist-cli/intent-replay.mjs check examples/csv-quotes-claude.intent.json --fail-on high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
